<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style type="text/css">
        label {
            flex-grow: 1;
            min-width: 100px;
            display: inline-block;
        }
        input, textarea {
            height: 30px;
            width: 250px;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            padding: 5px;
            vertical-align: middle;
        }
        textarea {
            height: 100px;
            resize: vertical;
        }
        .form-row {
            margin: 5px 0;
            display: flex;
            align-items: center;
            width: 400px;
        }
        button {
            margin-top: 10px;
            padding: 7px 15px;
        }
    </style>
</head>
<body>
<form method="POST">
    <div class="form-row">
        <label for="sender">Отправитель</label>
        <input id="sender" type="email" name="sender" placeholder="E-mail" required autocomplete="email">
    </div>
    <div class="form-row">
        <label for="receiver">Получатель</label>
        <input id="receiver" type="email" name="receiver" placeholder="E-mail" required autocomplete="email">
    </div>
    <div class="form-row">
        <label for="subject">Тема</label>
        <input id="subject" type="text" name="subject" placeholder="Тема" required>
    </div>
    <div class="form-row" style="align-items: flex-start;">
        <label for="message">Сообщение</label>
        <textarea id="message" name="message" placeholder="Сообщение" required></textarea>
    </div>
    <button type="submit">Отправить</button>
</form>
</body>
</html>
